services:
  - type: web
    name: metrosync-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false # set in Render dashboard (MongoDB Atlas URI)
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: CLIENT_ORIGIN
        value: "*"
